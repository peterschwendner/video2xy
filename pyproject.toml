[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video2xy"
version = "0.2.0"
description = "Convert raster video into stereo XY oscilloscope scan signals"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Peter Schwendner"}]
dependencies = ["numpy>=2.0,<3", "opencv-python>=4.10,<6"]

[project.optional-dependencies]
play = ["sounddevice>=0.5,<0.6"]

[project.scripts]
video2xy = "video_to_xy_audio:main"

[project.urls]
Repository = "https://github.com/peterschwendner/video2xy"

[tool.setuptools]
py-modules = ["video_to_xy_audio"]
